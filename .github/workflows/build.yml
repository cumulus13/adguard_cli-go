name: Build Matrix

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          # Termux / Android
          - goos: android
            goarch: arm64
          - goos: android
            goarch: arm
            goarm: 7
          # macOS
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BIN_NAME="adguard-cli-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            BIN_NAME="${BIN_NAME}v${{ matrix.goarm }}"
          fi
          BIN_NAME="${BIN_NAME}${{ matrix.ext }}"

          EXTRA_FLAGS=""
          if [ "${{ matrix.goos }}" == "android" ]; then
            EXTRA_FLAGS="-buildmode=pie"
          fi

          go build $EXTRA_FLAGS -ldflags="-s -w" -o "dist/${BIN_NAME}" .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/