name: GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build All Release Targets
        run: |
          mkdir -p release_dist
          
          targets=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm/7"
            "android/arm64"
            "android/arm/7"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64/.exe"
          )

          for target in "${targets[@]}"; do
            IFS="/" read -r os arch arg ext <<< "$target"
            
            export GOOS=$os
            export GOARCH=$arch
            export CGO_ENABLED=0
            
            if [ "$arch" == "arm" ]; then
              export GOARM=$arg
              OUT_NAME="adguard-cli-${os}-${arch}v${arg}${ext}"
            else
              OUT_NAME="adguard-cli-${os}-${arch}${arg}"
            fi

            echo "Building ${OUT_NAME}..."
            go build -ldflags="-s -w" -o "release_dist/${OUT_NAME}" .
          done

      - name: Generate Checksums
        run: |
          cd release_dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}