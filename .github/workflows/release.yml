name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Multi-Platform Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Download Modules
        run: go mod download

      - name: Build All Platform Binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          
          # Android (Pure Go builds)
          GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o dist/adguard_cli-android-arm64 .
          GOOS=android GOARCH=amd64 go build -ldflags="-s -w" -o dist/adguard_cli-android-amd64 .
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/adguard_cli-android-armv7 .
          GOOS=linux GOARCH=386 go build -ldflags="-s -w" -o dist/adguard_cli-android-386 .

          # Linux
          GOOS=linux GOARCH=386 go build -ldflags="-s -w" -o dist/adguard_cli-linux-386 .
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/adguard_cli-linux-amd64 .
          GOOS=linux GOARCH=arm GOARM=6 go build -ldflags="-s -w" -o dist/adguard_cli-linux-armv6 .
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/adguard_cli-linux-armv7 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/adguard_cli-linux-arm64 .
          GOOS=linux GOARCH=mips go build -ldflags="-s -w" -o dist/adguard_cli-linux-mips .
          GOOS=linux GOARCH=mipsle go build -ldflags="-s -w" -o dist/adguard_cli-linux-mipsle .
          GOOS=linux GOARCH=mips64 go build -ldflags="-s -w" -o dist/adguard_cli-linux-mips64 .
          GOOS=linux GOARCH=mips64le go build -ldflags="-s -w" -o dist/adguard_cli-linux-mips64le .
          GOOS=linux GOARCH=ppc64le go build -ldflags="-s -w" -o dist/adguard_cli-linux-ppc64le .
          GOOS=linux GOARCH=riscv64 go build -ldflags="-s -w" -o dist/adguard_cli-linux-riscv64 .
          GOOS=linux GOARCH=s390x go build -ldflags="-s -w" -o dist/adguard_cli-linux-s390x .

          # macOS (Darwin)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/adguard_cli-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/adguard_cli-darwin-arm64 .

          # Windows
          GOOS=windows GOARCH=386 go build -ldflags="-s -w" -o dist/adguard_cli-windows-386.exe .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/adguard_cli-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/adguard_cli-windows-arm64.exe .

          # BSDs
          GOOS=freebsd GOARCH=amd64 go build -ldflags="-s -w" -o dist/adguard_cli-freebsd-amd64 .
          GOOS=freebsd GOARCH=arm64 go build -ldflags="-s -w" -o dist/adguard_cli-freebsd-arm64 .
          GOOS=netbsd GOARCH=amd64 go build -ldflags="-s -w" -o dist/adguard_cli-netbsd-amd64 .
          GOOS=openbsd GOARCH=amd64 go build -ldflags="-s -w" -o dist/adguard_cli-openbsd-amd64 .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}